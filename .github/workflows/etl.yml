name: ETL — Sincronização BNAFAR

on:
  schedule:
    # 08:00 Brasília = 11:00 UTC
    - cron: '0 11 * * *'
    # 12:00 Brasília = 15:00 UTC
    - cron: '0 15 * * *'
    # 18:00 Brasília = 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL específica do arquivo BNAFAR (opcional — sobrescreve a busca automática)'
        required: false
        default: ''

jobs:
  sync:
    name: Sincronizar dados BNAFAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Garantir unzip disponível
        run: command -v unzip || sudo apt-get install -y unzip

      - name: Instalar dependências
        run: npm ci

      - name: Executar ETL (download + import)
        run: npm run etl:sync
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          BNAFAR_FILES_URL: ${{ secrets.BNAFAR_FILES_URL }}
          BNAFAR_FILE_URL:  ${{ github.event.inputs.file_url }}
          ETL_SOURCE:       cron

      - name: Notificar falha
        if: failure()
        run: echo "::error::Sincronização BNAFAR falhou em $(date '+%Y-%m-%d %H:%M UTC')"
